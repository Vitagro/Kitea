services:
  - type: web
    name: kitea-logistics-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Secrets à renseigner manuellement dans le dashboard Render
      # (Settings > Environment) - ne jamais les committer.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ERP_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ERP_BASE_URL
        sync: false
